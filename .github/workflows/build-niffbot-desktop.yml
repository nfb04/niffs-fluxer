name: build niffbot desktop

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build (win or linux)
        required: false
        type: choice
        options:
          - win
          - linux
        default: win
      instance_url:
        description: Default instance URL baked into the client
        required: false
        default: https://chat.niffbot.com
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    if: inputs.target == 'win'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows portable client
        shell: bash
        env:
          TARGET: win
          NIFFBOT_INSTANCE_URL: ${{ inputs.instance_url }}
          OUTPUT_DIR: ${{ github.workspace }}/artifacts
        run: ./scripts/build-niffbot-desktop.sh

      - uses: actions/upload-artifact@v4
        with:
          name: niffbot-desktop-windows-x64
          path: artifacts/niffs-fluxer-windows-x64-portable.zip

  build-linux:
    if: inputs.target == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native build deps
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev zip

      - name: Build Linux AppImage
        env:
          TARGET: linux
          NIFFBOT_INSTANCE_URL: ${{ inputs.instance_url }}
          OUTPUT_DIR: ${{ github.workspace }}/artifacts
        run: ./scripts/build-niffbot-desktop.sh

      - uses: actions/upload-artifact@v4
        with:
          name: niffbot-desktop-linux-x64
          path: artifacts/niffs-fluxer-linux-x64.AppImage
